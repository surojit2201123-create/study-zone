name: Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Initialize PWA to TWA Project
        run: |
          bubblewrap init --manifest=https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/manifest.json --directory=android-app --skip-validation || true

      - name: Build APK using Bubblewrap
        run: |
          cd android-app || mkdir -p android-app && cd android-app
          bubblewrap update --manifest=https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/manifest.json || true
          bubblewrap build || echo "Check manifest configuration"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: |
            android-app/*.apk
            android-app/app/build/outputs/apk/release/*.apk
